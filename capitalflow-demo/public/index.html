<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitalflow — Supplier Asset Verification (Demo)</title>
<style>
:root{
  --navy:#0e2a52;
  --navy-2:#153a6b;
  --pink:#e6237e;
  --green:#3aa635;
  --gray-bg:#eef0f3;
  --gray-line:#c3c9d3;
  --gray-mid:#8891a0;
  --gray-dark:#3d4553;
  --white:#ffffff;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system, 'Segoe UI', Arial, sans-serif;
  background:#d7dce3;
  color:var(--gray-dark);
  min-height:100vh;
}
.phone-wrap{
  max-width:420px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px;
}
.device{
  width:100%;
  background:var(--white);
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  overflow:hidden;
  min-height:640px;
  display:flex;
  flex-direction:column;
}
.statusbar{
  background:var(--navy);
  padding:10px 16px;
  display:flex;
  align-items:center;
}
.logo-sm{ height:20px; background:#fff; padding:4px 8px; border-radius:5px; }
.screen{ flex:1; padding:16px; background:var(--gray-bg); overflow-y:auto; }

.demo-note{
  font-size:11px; color:var(--gray-mid); text-align:center;
  margin-top:10px; max-width:340px;
}
.floating-dash-btn{
  margin-top:14px;
  background:none; border:1px solid var(--gray-mid); color:var(--gray-dark);
  font-size:12px; padding:6px 14px; border-radius:16px; cursor:pointer;
}

h2.title{ font-size:16px; color:var(--navy); margin:0 0 4px; }
p.sub{ font-size:12px; color:var(--gray-mid); margin:0 0 16px; }

.label-tag{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--gray-mid); margin:0 0 4px; }
.field{
  width:100%; background:var(--white); border:1px solid var(--gray-line);
  border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:12px;
  font-family:inherit;
}
.field.error{ border-color:var(--pink); color:#8a0f3d; }

.btn{
  display:block; width:100%; text-align:center; border:none; border-radius:24px;
  padding:12px; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:10px;
}
.btn-primary{ background:var(--pink); color:#fff; }
.btn-primary:disabled{ background:#f2b9d1; cursor:not-allowed; }
.btn-secondary{ background:var(--navy); color:#fff; }
.btn-outline{ background:transparent; border:1px solid var(--gray-line); color:var(--gray-dark); }
.btn-ghost{ background:none; border:none; color:var(--navy-2); text-decoration:underline; font-size:12px; cursor:pointer; padding:0; margin:0; }

.card{
  background:#fff; border:1px solid var(--gray-line); border-radius:8px;
  padding:12px; margin-bottom:10px;
}
.row{ display:flex; justify-content:space-between; align-items:center; }
.muted{ color:var(--gray-mid); font-size:11px; }

.pill{ display:inline-block; font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; }
.pill-pending{ background:#fdeccf; color:#9a6b0a; }
.pill-submitted{ background:#d9ecff; color:#1a5aa3; }
.pill-verified{ background:#dcf3db; color:#2c7a28; }
.pill-flagged{ background:#fcdde3; color:#b8134f; }

.note-box{
  border-radius:6px; padding:9px 10px; font-size:11px; margin-bottom:12px;
  display:flex; gap:6px; align-items:flex-start;
}
.note-ok{ background:#dcf3db; color:#2c7a28; border:1px solid #a8dba3; }
.note-warn{ background:#fff8e6; color:#7a5c00; border:1px solid #f0d98c; }
.note-error{ background:#fcdde3; color:#8a0f3d; border:1px solid #f0a8bf; }

.camera-wrap{
  position:relative; border-radius:10px; overflow:hidden; background:#000;
  height:280px; margin-bottom:10px; display:flex; align-items:center; justify-content:center;
}
.camera-wrap video, .camera-wrap canvas{ width:100%; height:100%; object-fit:cover; }
.camera-wrap .cam-msg{ color:#8891a0; font-size:12px; text-align:center; padding:20px; }
.badge-float{
  position:absolute; background:rgba(14,42,82,.88); color:#fff; font-size:10px;
  padding:3px 8px; border-radius:4px;
}
.shutter{
  width:58px; height:58px; border-radius:50%; background:#fff; border:4px solid var(--pink);
  margin:8px auto 0; cursor:pointer; display:block;
}
.shutter:disabled{ opacity:.4; cursor:not-allowed; }

.thumb-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.thumb{
  background:#dfe3e9; border-radius:6px; height:66px; overflow:hidden; position:relative;
}
.thumb img{ width:100%; height:100%; object-fit:cover; }
.thumb .lock{ position:absolute; top:3px; right:3px; font-size:10px; }

.checklist-row{
  display:flex; align-items:center; gap:8px; font-size:12px; padding:8px 0;
  border-bottom:1px solid #e4e7ec;
}
.radio-set{ display:flex; gap:6px; margin-left:auto; }
.radio-opt{
  font-size:10px; padding:4px 9px; border-radius:12px; border:1px solid var(--gray-line);
  color:var(--gray-mid); background:#fff; cursor:pointer;
}
.radio-opt.sel-good{ background:#dcf3db; border-color:var(--green); color:#2c7a28; }
.radio-opt.sel-fair{ background:#fdeccf; border-color:#e0a63a; color:#9a6b0a; }
.radio-opt.sel-bad{ background:#fcdde3; border-color:var(--pink); color:#b8134f; }

.meta-line{ display:flex; justify-content:space-between; font-size:12px; padding:6px 0; border-bottom:1px solid #eef0f3; }
.meta-line b{ color:var(--navy); }

.success-tick{
  width:60px; height:60px; border-radius:50%; background:var(--green); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:30px; margin:36px auto 14px;
}

table{ width:100%; border-collapse:collapse; font-size:11px; }
th{ text-align:left; font-size:9.5px; text-transform:uppercase; color:var(--gray-mid); padding:6px; border-bottom:2px solid var(--gray-line); }
td{ padding:8px 6px; border-bottom:1px solid #eef0f3; }
tr{ cursor:pointer; }
tr:hover td{ background:#f7f9fb; }

textarea.field{ resize:vertical; min-height:50px; }

.map-placeholder{
  background:repeating-linear-gradient(45deg,#dfe6ee,#dfe6ee 8px,#e8edf3 8px,#e8edf3 16px);
  border-radius:6px; height:90px; position:relative; margin-bottom:10px; border:1px solid var(--gray-line);
}
.pin{
  position:absolute; top:38%; left:48%; width:14px; height:14px; background:var(--pink);
  border-radius:50% 50% 50% 0; transform:rotate(-45deg);
}
.audit-item{
  display:flex; gap:8px; font-size:11px; padding:6px 0 6px 12px;
  border-left:2px solid var(--gray-line); margin-left:6px; position:relative;
}
.audit-item::before{
  content:''; position:absolute; left:-5px; top:9px; width:8px; height:8px; border-radius:50%; background:var(--navy);
}
.notif-card{ border-left:3px solid var(--gray-line); }
.notif-card.flagged{ border-left-color:var(--pink); }
.notif-card.verified{ border-left-color:var(--green); opacity:.85; }
.bell{
  margin-left:auto; background:none; border:none; color:#fff; font-size:16px; cursor:pointer; position:relative;
}
.bell .dot{
  position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:var(--pink); border-radius:50%;
}

.tabbar{
  display:flex; background:var(--white); border-top:1px solid var(--gray-line);
  padding:6px 4px 8px; flex-shrink:0;
}
.tabbar.hidden{ display:none; }
.tab{
  flex:1; background:none; border:none; cursor:pointer; padding:4px 0;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-family:inherit; font-size:10px; color:var(--gray-mid); position:relative;
}
.tab .ico{ font-size:17px; line-height:1; }
.tab.active{ color:var(--pink); font-weight:700; }
.tab-dot{
  position:absolute; top:0; left:50%; margin-left:8px;
  width:7px; height:7px; background:var(--pink); border-radius:50%;
}
.backlink{
  background:none; border:none; padding:0; margin:0 0 10px; font-family:inherit;
  font-size:11px; color:var(--gray-mid); cursor:pointer; display:block; text-align:left;
}
.backlink:hover{ color:var(--navy-2); text-decoration:underline; }
/* ---- internal review console ---- */
.screen.internal{ background:#e6eaf1; }
.kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.kpi{ background:#fff; border:1px solid var(--gray-line); border-radius:8px; padding:9px 6px; text-align:center; }
.kpi b{ display:block; font-size:19px; line-height:1.15; color:var(--navy); }
.kpi span{ font-size:8.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--gray-mid); }
.kpi.warn b{ color:#9a6b0a; }
.kpi.good b{ color:var(--green); }
.kpi.bad b{ color:var(--pink); }

.chips{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.chip{
  font-size:10px; font-weight:600; padding:5px 11px; border-radius:14px;
  border:1px solid var(--gray-line); background:#fff; color:var(--gray-dark);
  cursor:pointer; font-family:inherit;
}
.chip.active{ background:var(--navy); border-color:var(--navy); color:#fff; }

.qcard{
  background:#fff; border:1px solid var(--gray-line); border-left:3px solid var(--gray-mid);
  border-radius:8px; padding:11px 12px; margin-bottom:9px; cursor:pointer;
}
.qcard:hover{ box-shadow:0 2px 9px rgba(14,42,82,.11); }
.qcard.s-submitted{ border-left-color:#1a5aa3; }
.qcard.s-verified{ border-left-color:var(--green); }
.qcard.s-flagged{ border-left-color:var(--pink); }
.qcard.s-pending{ border-left-color:#e0a63a; }
.qmeta{ font-size:11px; color:var(--gray-mid); margin-top:4px; }
.checks{ display:flex; gap:11px; margin-top:8px; font-size:10px; }
.check{ color:var(--gray-mid); }
.check.pass{ color:#2c7a28; }
.check.fail{ color:#b8134f; font-weight:600; }

.detail-head{ background:var(--navy); color:#fff; border-radius:9px; padding:12px 13px; margin-bottom:12px; }
.detail-head .dh-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.detail-head b{ font-size:14px; }
.detail-head .dh-meta{ font-size:11px; color:#b6c4d7; margin-top:5px; }

.checkrow{ display:flex; align-items:flex-start; gap:9px; font-size:11.5px; padding:9px 0; border-bottom:1px solid #eef0f3; }
.checkrow:last-child{ border-bottom:none; }
.checkrow .mark{
  width:17px; height:17px; border-radius:50%; color:#fff; font-size:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.checkrow.pass .mark{ background:var(--green); }
.checkrow.fail .mark{ background:var(--pink); }
.checkrow .cr-sub{ display:block; color:var(--gray-mid); font-size:10px; margin-top:2px; }

.map-box{
  position:relative; height:104px; border-radius:8px; overflow:hidden;
  border:1px solid var(--gray-line); margin-bottom:10px;
  background:
    linear-gradient(0deg, rgba(255,255,255,.5) 1px, transparent 1px) 0 0/100% 18px,
    linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px) 0 0/18px 100%,
    linear-gradient(135deg,#dae3ee,#eaf0f6);
}
.map-box .road{ position:absolute; background:#ccd8e5; }
.map-box .coord{
  position:absolute; bottom:6px; left:6px; background:rgba(14,42,82,.86); color:#fff;
  font-size:9.5px; padding:3px 7px; border-radius:4px;
}
.map-pin{
  position:absolute; top:32%; left:46%; width:15px; height:15px; background:var(--pink);
  border:2px solid #fff; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
  box-shadow:0 2px 5px rgba(0,0,0,.32);
}
.photo-empty{
  background:#e3e8ee; border:1px dashed var(--gray-line); border-radius:8px;
  padding:18px 14px; text-align:center; font-size:11px; color:var(--gray-mid); margin-bottom:10px;
}
.btn-verify{ background:var(--green); color:#fff; }
.btn-flag{ background:#fff; border:1px solid var(--pink); color:#b8134f; }
</style>
</head>

<script>
// ---------- Mock data (stands in for Capitalflow's real records) ----------

const defaultCondition = () =>

// registered coordinates for each site — used when the device won't give us GPS

const ASSIGNMENTS = [

  { id: 'a4', name: '2022 Mercedes Sprinter', agreement: 'CF-AG-2210', serialOnFile: 'WDB9066331R123456', site: 'Dublin Port', supplier: 'Dublin Fleet Co', status: 'verified',

];

// seed the dashboard with a couple of already-reviewed examples
let SUBMISSIONS = [
  { id: 'CF-2201', assetName: '2022 Mercedes Sprinter', supplier: 'Dublin Fleet Co', agreement: 'CF-AG-2210',

    serial: 'WF0XXXTTGXKA00000', gps: { lat: 51.8985, lon: -8.4756 }, time: '05 Sep, 11:47', photos: [], status: 'submitted', notes: '',
    siteMatch: true, serialMatch: true },
];

// seed notifications to match the flag/verify examples above
let NOTIFICATIONS = [
  { id: 'n1', type: 'flagged', assetId: 'a2', assetName: 'Volvo L60H Loader', reason: 'Serial plate photo unreadable', time: '2 min ago', unread: true },

];

// ---------- App state ----------
let state = {
  view: 'login',
  currentAssetId: null,
  draft: null, // { serial, serialOk, gps, time, photos:[], shotIndex, condition:{}, notes }
  stream: null,
  dashDetailId: null,
  dashFilter: 'all',
};

const screenEl = document.getElementById('screen');
const tabbarEl = document.getElementById('tabbar');
const dashBtn = document.getElementById('dashBtn');
dashBtn.addEventListener('click', () => { stopCamera(); state.view = 'dashList'; render(); });
document.getElementById('bellBtn').addEventListener('click', () => { stopCamera(); state.view = 'notifications'; render(); });
updateBellDot();

function updateBellDot() {
  const dot = document.getElementById('bellDot');
  if (dot) dot.style.display = NOTIFICATIONS.some(n => n.unread) ? 'block' : 'none';
  syncTabDot();
}

// keep the Alerts tab's unread dot in step with the bell
function syncTabDot() {
  const tab = tabbarEl.querySelector('.tab[data-view="notifications"]');
  if (!tab) return;
  const has = NOTIFICATIONS.some(n => n.unread);
  const existing = tab.querySelector('.tab-dot');
  if (has && !existing) {
    const s = document.createElement('span');
    s.className = 'tab-dot';
    tab.appendChild(s);
  } else if (!has && existing) {
    existing.remove();
  }
}

function go(view, extra = {}) {
  stopCamera();
  state = { ...state, view, ...extra };
  render();
}

function stopCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
}

function refNumber() {
  return 'CF-' + Math.floor(2000 + Math.random() * 900) + '-' + Math.random().toString(36).slice(2, 4).toUpperCase();
}

// ---------- Bottom tab bar ----------
const TABS = [
  { key: 'home',    view: 'assignments',   icon: '\u{1F3E0}', label: 'Home' },
  { key: 'history', view: 'history',       icon: '\u{1F4CB}', label: 'History' },
  { key: 'alerts',  view: 'notifications', icon: '\u{1F514}', label: 'Alerts' },
  { key: 'profile', view: 'profile',       icon: '\u{1F464}', label: 'Profile' },
];

// which tab lights up for each screen
const VIEW_TAB = {
  assignments: 'home', capture: 'home', review: 'home', summary: 'home',
  confirmation: 'home', resubmit: 'home', assetStatus: 'home',
  history: 'history', notifications: 'alerts', profile: 'profile',
};

// login and the internal dashboard aren't part of the supplier tab flow
const NO_TABBAR = ['login', 'dashList', 'dashDetail'];

function renderTabbar() {
  if (NO_TABBAR.includes(state.view)) {
    tabbarEl.classList.add('hidden');
    tabbarEl.innerHTML = '';
    return;
  }
  tabbarEl.classList.remove('hidden');
  const active = VIEW_TAB[state.view] || 'home';
  const unread = NOTIFICATIONS.some(n => n.unread);
  tabbarEl.innerHTML = TABS.map(t => `
    <button class="tab ${t.key === active ? 'active' : ''}" data-view="${t.view}">
      <span class="ico">${t.icon}</span>${t.label}
      ${t.key === 'alerts' && unread ? '<span class="tab-dot"></span>' : ''}
    </button>
  `).join('');
  tabbarEl.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => go(btn.dataset.view);
  });
}

// ---------- Render router ----------
function render() {
  renderTabbar();
  const v = state.view;

  // the review console is a different persona: cooler background, no supplier bell
  const internal = (v === 'dashList' || v === 'dashDetail');
  screenEl.classList.toggle('internal', internal);
  const bell = document.getElementById('bellBtn');
  if (bell) bell.style.display = internal ? 'none' : '';
  if (v === 'login') return renderLogin();
  if (v === 'assignments') return renderAssignments();
  if (v === 'capture') return renderCapture();
  if (v === 'review') return renderReview();
  if (v === 'summary') return renderSummary();
  if (v === 'confirmation') return renderConfirmation();
  if (v === 'dashList') return renderDashList();
  if (v === 'dashDetail') return renderDashDetail();
  if (v === 'resubmit') return renderResubmit();
  if (v === 'notifications') return renderNotifications();
  if (v === 'assetStatus') return renderAssetStatus();
  if (v === 'history') return renderHistory();
  if (v === 'profile') return renderProfile();
}

// ---------- Screens ----------
function renderLogin() {
  screenEl.innerHTML = `
    <div style="display:flex;flex-direction:column;justify-content:center;min-height:520px;">
      <div style="text-align:center;margin-bottom:24px;">
        <h2 class="title">Supplier Portal</h2>
        <p class="sub">Log in to submit asset verification photos</p>
      </div>
      <div class="label-tag">Supplier ID or email</div>
      <input class="field" id="loginEmail" placeholder="supplier@company.ie" value="supplier@naasrdplant.ie">
      <div class="label-tag">PIN</div>
      <input class="field" id="loginPin" type="password" placeholder="••••••" value="123456">
      <button class="btn btn-primary" id="loginBtn">Log in</button>
    </div>
  `;
  document.getElementById('loginBtn').onclick = () => {
    const typed = document.getElementById('loginEmail').value.trim();
    if (typed) SUPPLIER.email = typed;
    go('assignments');
  };
}

function renderAssignments() {
  const rows = ASSIGNMENTS.map(a => `
    <div class="card" data-id="${a.id}" style="cursor:pointer;">
      <div class="row"><b style="font-size:12px;">${a.name}</b>${statusPill(a.status)}</div>
      <div class="muted" style="margin-top:4px;">${a.site} · Agreement ${a.agreement}</div>
      ${a.status === 'flagged' ? `<div class="muted" style="color:#b8134f;margin-top:4px;">🚩 ${a.flagReason}</div>` : ''}
    </div>
  `).join('');
  screenEl.innerHTML = `
    <h2 class="title">My assignments</h2>
    <p class="sub">Tap an asset to verify it</p>
    ${rows}
  `;
  screenEl.querySelectorAll('.card').forEach(card => {
    card.onclick = () => {
      const asset = ASSIGNMENTS.find(a => a.id === card.dataset.id);
      if (asset.status === 'flagged') {
        go('resubmit', { currentAssetId: asset.id });
      } else if (asset.status === 'submitted' || asset.status === 'verified') {
        go('assetStatus', { currentAssetId: asset.id });
      } else {
        startCaptureFlow(asset.id);
      }
    };
  });
}

function renderAssetStatus() {
  const asset = ASSIGNMENTS.find(a => a.id === state.currentAssetId);
  const msg = asset.status === 'verified'
    ? 'This submission has been reviewed and verified — no action needed.'
    : 'This submission is with the review team. You\'ll get a notification here if anything needs fixing.';
  screenEl.innerHTML = `
    <button class="backlink" id="backLink">← My assignments</button>
    <div class="card">
      <div class="row"><b style="font-size:13px;">${asset.name}</b>${statusPill(asset.status)}</div>
      <div class="muted" style="margin-top:6px;">${asset.site} · Agreement ${asset.agreement}</div>
    </div>
    <div class="note-box ${asset.status === 'verified' ? 'note-ok' : 'note-warn'}">${asset.status === 'verified' ? '✓' : '⏳'} ${msg}</div>
    <button class="btn btn-ghost" id="backBtn">← Back to assignments</button>
  `;
  document.getElementById('backLink').onclick = () => go('assignments');
  document.getElementById('backBtn').onclick = () => go('assignments');
}

function renderNotifications() {
  NOTIFICATIONS.forEach(n => n.unread = false);
  const cards = NOTIFICATIONS.map(n => {
    if (n.type === 'flagged') {
      return `
        <div class="card notif-card flagged">
          <div class="row"><b style="font-size:12px;">Action needed</b><span class="muted">${n.time}</span></div>
          <div style="font-size:12px;margin-top:4px;">Your submission for <b>${n.assetName}</b> was flagged.</div>
          <div class="muted" style="margin-top:4px;">Reason: ${n.reason}</div>
          <button class="btn btn-primary" style="margin-top:10px;" data-resubmit="${n.assetId}">Resubmit now</button>
        </div>`;
    }
    return `
      <div class="card notif-card verified">
        <div class="row"><b style="font-size:12px;">Verified</b><span class="muted">${n.time}</span></div>
        <div style="font-size:12px;margin-top:4px;">${n.assetName} — submission verified, no action needed.</div>
      </div>`;
  }).join('');

  screenEl.innerHTML = `
    <h2 class="title">Notifications</h2>
    ${cards || '<p class="sub">Nothing yet.</p>'}
    <div class="note-box note-warn" style="margin-top:16px;">✉️ The same message is also emailed to the supplier's registered contact, in case the app isn't open.</div>
    <button class="btn btn-ghost" id="backBtn" style="margin-top:10px;">← Back to assignments</button>
  `;
  updateBellDot();
  screenEl.querySelectorAll('[data-resubmit]').forEach(btn => {
    btn.onclick = () => go('resubmit', { currentAssetId: btn.dataset.resubmit });
  });
  document.getElementById('backBtn').onclick = () => go('assignments');
}

function renderHistory() {
  const rows = SUBMISSIONS.map(s => `
    <div class="card">
      <div class="row"><b style="font-size:12px;">${s.assetName}</b>${statusPill(s.status)}</div>
      <div class="muted" style="margin-top:4px;">Ref ${s.id} \u00b7 ${s.time}</div>
      <div class="muted" style="margin-top:2px;">Agreement ${s.agreement}</div>
      ${s.status === 'flagged' && s.flagReason ? `<div class="muted" style="color:#b8134f;margin-top:4px;">\u{1F6A9} ${s.flagReason}</div>` : ''}
    </div>
  `).join('');
  screenEl.innerHTML = `
    <h2 class="title">Submission history</h2>
    <p class="sub">Everything you've sent for review</p>
    ${rows || '<div class="note-box note-warn">Nothing submitted yet \u2014 verify an asset from Home to get started.</div>'}
  `;
}

function renderProfile() {
  const record = SUPPLIER_HISTORY[SUPPLIER.name] || 'No history on file';
  const sites = SUPPLIER.sites.map((site, i) => `
    <div class="meta-line"${i === SUPPLIER.sites.length - 1 ? ' style="border-bottom:none;"' : ''}>
      <span>${site}</span><b>Registered</b>
    </div>`).join('');
  screenEl.innerHTML = `
    <h2 class="title">Profile</h2>
    <p class="sub">Your supplier account</p>
    <div class="card">
      <div class="row"><b style="font-size:13px;">${SUPPLIER.name}</b><span class="pill pill-verified">Active</span></div>
      <div class="meta-line"><span>Supplier ID</span><b>${SUPPLIER.id}</b></div>
      <div class="meta-line"><span>Registered contact</span><b>${SUPPLIER.email}</b></div>
      <div class="meta-line"><span>Phone</span><b>${SUPPLIER.phone}</b></div>
      <div class="meta-line" style="border-bottom:none;"><span>Verification record</span><b>${record}</b></div>
    </div>
    <div class="label-tag">Registered sites</div>
    <div class="card">${sites}</div>
    <div class="note-box note-warn">\u2709\ufe0f Flag and verification notices are also emailed to ${SUPPLIER.email}.</div>
    <button class="btn btn-outline" id="signOutBtn">Sign out</button>
  `;
  document.getElementById('signOutBtn').onclick = () => go('login');
}

function statusPill(status) {
  const map = {
    pending: ['pill-pending', 'Pending'],
    submitted: ['pill-submitted', 'Submitted'],
    verified: ['pill-verified', 'Verified'],
    flagged: ['pill-flagged', 'Needs resubmit'],
  };
  const [cls, label] = map[status] || map.pending;
  return `<span class="pill ${cls}">${label}</span>`;
}

function startCaptureFlow(assetId) {
  const asset = ASSIGNMENTS.find(a => a.id === assetId);
  state.currentAssetId = assetId;
  state.resubmitBanner = null;
  state.draft = {
    serial: '', serialOk: false, gps: null, gpsSource: null, time: null,
    photos: [], shotIndex: 0, condition: defaultCondition(), notes: '',
  };
  go('capture', { currentAssetId: assetId });
  requestGPS();
}

function requestGPS() {
  const asset = ASSIGNMENTS.find(a => a.id === state.currentAssetId);

  // timestamp is independent of location — stamp it straight away
  state.draft.time = new Date();

  // if the device won't hand over GPS, fall back to the site on file so the
  // capture flow still completes (in-app browsers routinely block geolocation)
  const useSite = () => {
    const site = (asset && SITE_GPS[asset.site]) || DEFAULT_GPS;
    state.draft.gps = { lat: site.lat, lon: site.lon };
    state.draft.gpsSource = 'site';
    state.draft.time = new Date();
    render();
  };

  if (!navigator.geolocation) { useSite(); return; }

  navigator.geolocation.getCurrentPosition(
    pos => {
      state.draft.gps = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      state.draft.gpsSource = 'device';
      state.draft.time = new Date();
      render();
    },
    useSite,
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function renderCapture() {
  const asset = ASSIGNMENTS.find(a => a.id === state.currentAssetId);
  const d = state.draft;
  const shotLabel = asset.shots[d.shotIndex];
  const gpsText = d.gps
    ? (d.gpsSource === 'site'
        ? `📍 ${asset.site}`
        : `📍 ${d.gps.lat.toFixed(4)}, ${d.gps.lon.toFixed(4)}`)
    : '📍 locating…';
  const timeText = d.time ? `🕒 ${d.time.toLocaleString()}` : '🕒 —';

  screenEl.innerHTML = `
    <div class="row" style="margin-bottom:10px;">
      <button class="backlink" id="backLink" style="margin:0;">← ${asset.name}</button>
      <span class="muted">${d.photos.length + 1} of ${asset.shots.length} photos</span>
    </div>

    ${d.gpsSource === 'site' ? `<div class="note-box note-warn">📍 Device GPS wasn't available in this browser, so photos are being stamped with the registered site location for ${asset.site}.</div>` : ''}
    ${state.resubmitBanner ? `<div class="note-box note-error">${state.resubmitBanner}</div>` : ''}

    <div class="camera-wrap" id="camWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="badge-float" style="top:8px;left:8px;">${gpsText}</div>
      <div class="badge-float" style="top:32px;left:8px;">${timeText}</div>
    </div>

    <div class="label-tag">Shot needed: ${shotLabel}</div>

    <div class="label-tag" style="margin-top:8px;">Serial / VIN number</div>
    <input class="field ${d.serial && !d.serialOk ? 'error' : ''}" id="serialInput" placeholder="Type or scan the plate" value="${d.serial}">
    ${serialNote(d, asset)}

    <button class="shutter" id="shutterBtn" ${(!d.serial.trim() || !d.gps) ? 'disabled' : ''}></button>
    <p class="sub" style="text-align:center;margin-top:8px;">${!d.gps ? 'Getting location…' : (!d.serial.trim() ? 'Enter a serial number to unlock the shutter' : '')}</p>
  `;

  // camera — reuse the existing stream if we already have one (don't re-request on every render)
  const video = document.getElementById('video');
  if (state.stream) {
    video.srcObject = state.stream;
    video.play().catch(() => {});
  } else if (!state.cameraRequestInFlight) {
    state.cameraRequestInFlight = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.cameraRequestInFlight = false;
      const wrap = document.getElementById('camWrap');
      if (wrap) wrap.innerHTML = `<div class="cam-msg">Camera API not available in this browser context.<br>Make sure you're on https:// and using Safari or Chrome directly.</div>`;
    } else {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => {
        state.cameraRequestInFlight = false;
        state.stream = stream;
        const v = document.getElementById('video');
        if (v) { v.srcObject = stream; v.play().catch(() => {}); }
      })
      .catch((err) => {
        state.cameraRequestInFlight = false;
        const wrap = document.getElementById('camWrap');
        if (wrap) wrap.innerHTML = `<div class="cam-msg">Camera unavailable or permission denied (${err.name}).<br>Check your browser's site settings and reload.<br>You can still continue with the fields above.</div>`;
      });
    }
  }

  document.getElementById('backLink').onclick = () => go('assignments');

  const serialInput = document.getElementById('serialInput');
  serialInput.oninput = (e) => {
    d.serial = e.target.value;
    d.serialOk = d.serial.trim().toUpperCase() === asset.serialOnFile.toUpperCase();
    render();
    document.getElementById('serialInput').focus();
    document.getElementById('serialInput').setSelectionRange(d.serial.length, d.serial.length);
  };

  document.getElementById('shutterBtn').onclick = () => {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    const ctx = canvas.getContext('2d');
    if (video.videoWidth) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    else { ctx.fillStyle = '#333'; ctx.fillRect(0,0,canvas.width,canvas.height); }
    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    d.photos.push({ label: shotLabel, dataUrl, gps: d.gps, time: d.time });
    d.shotIndex++;
    if (d.shotIndex >= asset.shots.length) {
      go('review', { currentAssetId: state.currentAssetId });
    } else {
      render();
    }
  };
}

function serialNote(d, asset) {
  if (!d.serial) return '';
  if (d.serialOk) {
    return `<div class="note-box note-ok">✓ Matches agreement ${asset.agreement} on file for this supplier.</div>`;
  }
  return `<div class="note-box note-warn">⚠️ Doesn't match agreement ${asset.agreement} on file (expected ${asset.serialOnFile}). The live product blocks submission here — the demo lets you continue, and the review team sees the mismatch flagged.</div>`;
}

function renderReview() {
  const asset = ASSIGNMENTS.find(a => a.id === state.currentAssetId);
  const d = state.draft;
  const thumbs = d.photos.map(p => `<div class="thumb"><img src="${p.dataUrl}"><span class="lock">🔒</span></div>`).join('');
  const conditionItems = CONDITION_ITEMS;

  screenEl.innerHTML = `
    <button class="backlink" id="backLink">← ${asset.name}</button>
    <div class="label-tag">Photos captured</div>
    <div class="thumb-grid">${thumbs}</div>
    <div class="label-tag">Condition check</div>
    <div class="card" id="conditionCard" style="padding:2px 12px;"></div>
    <div class="label-tag" style="margin-top:8px;">Notes (optional)</div>
    <textarea class="field" id="notesInput" placeholder="Anything worth flagging...">${d.notes}</textarea>
    <button class="btn btn-secondary" id="continueBtn">Continue</button>
  `;

  const condCard = document.getElementById('conditionCard');
  condCard.innerHTML = conditionItems.map(item => {
    const val = d.condition[item] || 'Good';
    return `
      <div class="checklist-row">
        ${item}
        <div class="radio-set" data-item="${item}">
          ${['Good','Fair','Damage'].map(opt => {
            const cls = opt === val ? (opt === 'Good' ? 'sel-good' : opt === 'Fair' ? 'sel-fair' : 'sel-bad') : '';
            return `<span class="radio-opt ${cls}" data-opt="${opt}">${opt}</span>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');

  condCard.querySelectorAll('.radio-set').forEach(set => {
    set.querySelectorAll('.radio-opt').forEach(btn => {
      btn.onclick = () => {
        d.condition[set.dataset.item] = btn.dataset.opt;
        render();
      };
    });
  });

  document.getElementById('backLink').onclick = () => go('assignments');
  document.getElementById('notesInput').oninput = (e) => { d.notes = e.target.value; };
  document.getElementById('continueBtn').onclick = () => go('summary', { currentAssetId: state.currentAssetId });
}

function renderSummary() {
  const asset = ASSIGNMENTS.find(a => a.id === state.currentAssetId);
  const d = state.draft;
  const conditionSummary = Object.values(d.condition).length
    ? Object.entries(d.condition).map(([k,v]) => `${k}: ${v}`).join(' · ')
    : 'Not set';

  screenEl.innerHTML = `
    <button class="backlink" id="backLink">← ${asset.name}</button>
    <h2 class="title">Review before sending</h2>
    <div class="card">
      <b style="font-size:13px;">${asset.name}</b>
      <div class="meta-line"><span>Serial / VIN</span><b>${d.serial} ${d.serialOk ? '✓' : '⚠️'}</b></div>
      <div class="meta-line"><span>Agreement on file</span><b>${asset.agreement}</b></div>
      <div class="meta-line"><span>Location</span><b>${d.gps ? d.gps.lat.toFixed(4)+', '+d.gps.lon.toFixed(4) + (d.gpsSource === 'site' ? ' (site)' : '') : '—'}</b></div>
      <div class="meta-line"><span>Captured</span><b>${d.time ? d.time.toLocaleString() : '—'}</b></div>
      <div class="meta-line"><span>Photos</span><b>${d.photos.length} attached</b></div>
      <div class="meta-line" style="border-bottom:none;"><span>Condition</span><b>${conditionSummary}</b></div>
    </div>
    <div class="note-box note-warn">🔒 Photos are timestamped and geotagged automatically from your device and can't be edited or replaced after capture.</div>
    <button class="btn btn-primary" id="submitBtn">Submit for review</button>
  `;

  document.getElementById('backLink').onclick = () => go('review', { currentAssetId: state.currentAssetId });

  document.getElementById('submitBtn').onclick = () => {
    const id = refNumber();
    SUBMISSIONS.unshift({
      id, assetName: asset.name, supplier: asset.supplier, agreement: asset.agreement,
      serial: d.serial, gps: d.gps, time: d.time ? d.time.toLocaleString() : '—',
      photos: d.photos, status: 'submitted', notes: d.notes, condition: d.condition,
      serialMatch: d.serialOk, siteMatch: true,
    });
    asset.status = 'submitted';
    go('confirmation', { lastRef: id });
  };
}

function renderConfirmation() {
  screenEl.innerHTML = `
    <div style="text-align:center;">
      <div class="success-tick">✓</div>
      <b style="font-size:15px;color:var(--navy);">Submission sent</b>
      <div class="muted" style="margin:6px 0 24px;">Reference #${state.lastRef || ''} · Awaiting review</div>
      <button class="btn btn-outline" id="backBtn">Back to assignments</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = () => go('assignments');
}

function renderResubmit() {
  const asset = ASSIGNMENTS.find(a => a.id === state.currentAssetId);
  state.draft = { serial: '', serialOk: false, gps: null, gpsSource: null, time: null, photos: [], shotIndex: 0, condition: defaultCondition(), notes: '' };
  state.resubmitBanner = `🚩 Flagged: ${asset.flagReason}. Retake this photo — everything else on file stays as-is.`;
  go('capture', { currentAssetId: asset.id });
  requestGPS();
}

function renderDashList() {
  const f = state.dashFilter || 'all';
  const n = st => SUBMISSIONS.filter(s => s.status === st).length;
  const list = f === 'all' ? SUBMISSIONS : SUBMISSIONS.filter(s => s.status === f);

  const chips = [
    ['all', 'All'], ['submitted', 'Awaiting'], ['verified', 'Verified'], ['flagged', 'Flagged'],
  ].map(([key, label]) =>
    `<button class="chip ${f === key ? 'active' : ''}" data-filter="${key}">${label}</button>`
  ).join('');

  const rows = list.map(s => {
    const serialOk = s.serialMatch !== false;
    const siteOk = s.siteMatch !== false;
    const shots = (s.photos && s.photos.length) || 0;
    return `
    <div class="qcard s-${s.status}" data-id="${s.id}">
      <div class="row"><b style="font-size:12.5px;">${s.assetName}</b>${statusPill(s.status)}</div>
      <div class="qmeta">${s.supplier} \u00b7 Ref ${s.id}</div>
      <div class="qmeta">Submitted ${s.time}</div>
      <div class="checks">
        <span class="check ${serialOk ? 'pass' : 'fail'}">${serialOk ? '\u2713' : '\u2715'} Serial</span>
        <span class="check ${siteOk ? 'pass' : 'fail'}">${siteOk ? '\u2713' : '\u2715'} Location</span>
        <span class="check">\u{1F4F7} ${shots} photo${shots === 1 ? '' : 's'}</span>
      </div>
    </div>`;
  }).join('');

  screenEl.innerHTML = `
    <div class="row" style="margin-bottom:12px;">
      <div>
        <h2 class="title" style="margin:0;">Submissions queue</h2>
        <p class="sub" style="margin:2px 0 0;">Internal review team</p>
      </div>
      <span class="pill" style="background:var(--navy);color:#fff;">Internal</span>
    </div>

    <div class="kpis">
      <div class="kpi warn"><b>${n('submitted')}</b><span>Awaiting</span></div>
      <div class="kpi good"><b>${n('verified')}</b><span>Verified</span></div>
      <div class="kpi bad"><b>${n('flagged')}</b><span>Flagged</span></div>
    </div>

    <div class="chips">${chips}</div>

    ${list.length ? rows : '<div class="note-box note-warn">Nothing in this bucket right now.</div>'}

    <button class="btn btn-ghost" id="backToApp" style="margin-top:14px;">\u2190 Back to supplier app</button>
  `;

  screenEl.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => go('dashList', { dashFilter: chip.dataset.filter });
  });
  screenEl.querySelectorAll('.qcard').forEach(card => {
    card.onclick = () => go('dashDetail', { dashDetailId: card.dataset.id });
  });
  document.getElementById('backToApp').onclick = () => go('login');
}

function renderDashDetail() {
  const s = SUBMISSIONS.find(x => x.id === state.dashDetailId);
  const gpsText = s.gps ? `${s.gps.lat.toFixed(4)}, ${s.gps.lon.toFixed(4)}` : '\u2014';
  const history = SUPPLIER_HISTORY[s.supplier] || 'No history on file';
  const serialOk = s.serialMatch !== false;
  const siteOk = s.siteMatch !== false;
  const decided = s.status === 'verified' || s.status === 'flagged';

  const photos = (s.photos && s.photos.length)
    ? `<div class="thumb-grid">${s.photos.map(pp => `<div class="thumb" style="height:90px;"><img src="${pp.dataUrl}"></div>`).join('')}</div>`
    : `<div class="photo-empty">No photos on this seeded example.<br>Submit an asset from the supplier app to see real captures here.</div>`;

  const condition = (s.condition && Object.keys(s.condition).length)
    ? `<div class="label-tag">Condition reported</div>
       <div class="card" style="padding:2px 12px;">
         ${Object.entries(s.condition).map(([k, v], i, a) =>
           `<div class="meta-line"${i === a.length - 1 ? ' style="border-bottom:none;"' : ''}><span>${k}</span><b>${v}</b></div>`
         ).join('')}
       </div>`
    : '';

  screenEl.innerHTML = `
    <button class="backlink" id="backLink">\u2190 Back to queue</button>

    <div class="detail-head">
      <div class="dh-row">
        <div>
          <b>${s.assetName}</b>
          <div class="dh-meta">${s.supplier}</div>
          <div class="dh-meta">Ref ${s.id} \u00b7 ${s.agreement}</div>
        </div>
        ${statusPill(s.status)}
      </div>
    </div>

    ${decided ? `<div class="note-box ${s.status === 'verified' ? 'note-ok' : 'note-error'}">
      ${s.status === 'verified'
        ? '\u2713 Marked verified \u2014 the supplier has been notified.'
        : '\u{1F6A9} Flagged: ' + (s.flagReason || 'Needs review') + ' \u2014 the supplier has been asked to resubmit.'}
    </div>` : ''}

    <div class="label-tag">Automatic checks</div>
    <div class="card" style="padding:4px 12px;">
      <div class="checkrow ${serialOk ? 'pass' : 'fail'}">
        <span class="mark">${serialOk ? '\u2713' : '\u2715'}</span>
        <span>Serial / VIN ${serialOk ? 'matches the agreement on file' : 'does NOT match the agreement on file'}
          <span class="cr-sub">${s.serial} \u00b7 ${serialOk ? 'blocking check, run at capture' : 'allowed through in demo mode'}</span>
        </span>
      </div>
      <div class="checkrow ${siteOk ? 'pass' : 'fail'}">
        <span class="mark">${siteOk ? '\u2713' : '\u2715'}</span>
        <span>GPS ${siteOk ? 'matches the registered site' : 'does not match the registered site'}
          <span class="cr-sub">${gpsText}</span>
        </span>
      </div>
    </div>

    <div class="label-tag">Photos</div>
    ${photos}

    <div class="label-tag">Capture location</div>
    <div class="map-box">
      <div class="road" style="top:44px;left:0;right:0;height:7px;"></div>
      <div class="road" style="top:0;bottom:0;left:98px;width:6px;"></div>
      <div class="map-pin"></div>
      <div class="coord">\u{1F4CD} ${gpsText}</div>
    </div>

    ${condition}

    ${s.notes ? `<div class="label-tag">Supplier notes</div>
       <div class="card" style="font-size:12px;">${s.notes}</div>` : ''}

    <div class="label-tag">Asset record</div>
    <div class="card">
      <div class="meta-line"><span>Serial / VIN</span><b>${s.serial}</b></div>
      <div class="meta-line"><span>Agreement</span><b>${s.agreement}</b></div>
      <div class="meta-line"><span>Submitted</span><b>${s.time}</b></div>
      <div class="meta-line" style="border-bottom:none;"><span>Supplier history</span><b>${history}</b></div>
    </div>

    <div class="label-tag">Audit trail</div>
    <div class="card" style="padding:10px 12px;">
      <div class="audit-item">Submitted by supplier \u2014 ${s.time}</div>
      <div class="audit-item">Auto-checks ${serialOk && siteOk ? 'passed' : 'returned a mismatch'}</div>
      <div class="audit-item">${decided ? 'Reviewer marked ' + s.status : 'Awaiting reviewer decision'}</div>
    </div>

    ${decided ? '' : `
      <button class="btn btn-verify" id="verifyBtn">Mark verified</button>
      <button class="btn btn-flag" id="flagBtn">Flag for follow-up</button>
      <div id="flagArea"></div>`}

    <button class="btn btn-ghost" id="backList" style="margin-top:10px;">\u2190 Back to queue</button>
  `;

  document.getElementById('backLink').onclick = () => go('dashList');
  document.getElementById('backList').onclick = () => go('dashList');

  const verifyBtn = document.getElementById('verifyBtn');
  if (verifyBtn) verifyBtn.onclick = () => {
    s.status = 'verified';
    pushNotification({ type: 'verified', assetName: s.assetName, assetId: s.id, reason: null });
    go('dashDetail', { dashDetailId: s.id });
  };

  const flagBtn = document.getElementById('flagBtn');
  if (flagBtn) flagBtn.onclick = () => {
    document.getElementById('flagArea').innerHTML = `
      <textarea class="field" id="reasonInput" placeholder="Reason (e.g. serial mismatch, location doesn't match site)"></textarea>
      <button class="btn btn-primary" id="confirmFlag">Send flag to supplier</button>
    `;
    document.getElementById('confirmFlag').onclick = () => {
      const reason = document.getElementById('reasonInput').value || 'Needs review';
      s.status = 'flagged';
      s.flagReason = reason;
      pushNotification({ type: 'flagged', assetName: s.assetName, assetId: s.id, reason });
      go('dashDetail', { dashDetailId: s.id });
    };
  };
}

function pushNotification({ type, assetName, assetId, reason }) {
  NOTIFICATIONS.unshift({
    id: 'n' + Date.now(), type, assetId, assetName, reason, time: 'Just now', unread: true,
  });
  updateBellDot();
}

render();

</script>
</body>
</html>
